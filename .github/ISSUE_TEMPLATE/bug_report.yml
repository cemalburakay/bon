name: Bug report
description: Report a reproducible Bon defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not include private prompts, access tokens, full model files, or unreviewed logs."
  - type: input
    id: version
    attributes:
      label: Bon commit or release
      placeholder: "Commit SHA or release tag"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU and VRAM
      placeholder: "GPU model and VRAM size, or CPU-only"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model tag
      options:
        - "bon2:27b-5gb"
        - "bon2:27b-7gb"
        - Setup only
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands and sanitized output.
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed private prompts, credentials, personal data, and model/tool downloads.
          required: true
