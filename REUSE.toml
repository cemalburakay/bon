  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LEGAL-DISCLAIMER.md",
  "LEGAL-REVIEW.md",
  "PRIVACY.md",
  "PUBLISHING-CHECKLIST.md",
  "README.md",
  "RELEASE-NOTES.md",
  "SECURITY.md",
  "SETUP-GUIDE.md",
  "SUPPORT.md",
